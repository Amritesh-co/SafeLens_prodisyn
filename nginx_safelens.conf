# Nginx Configuration for SafeLensAI EC2 Instance
# /etc/nginx/sites-available/safelens

server {
    listen 80;
    server_name YOUR_EC2_PUBLIC_IP_OR_DOMAIN;

    # Backend API Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media and Static Files (S3 or local storage)
    location /media/ {
        alias /home/ubuntu/P004-SafeLensAI-Production/api/storage/;
    }

    location /static/ {
        alias /home/ubuntu/P004-SafeLensAI-Production/api/static/;
    }

    # Default: frontend is hosted on Amplify, so this Nginx is mainly for the API
    location / {
        return 404;
    }
}
