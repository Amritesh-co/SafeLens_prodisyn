version: 0.0
os: linux
 
file_exists_behavior: OVERWRITE
 
files:
  - source: /
    destination: /home/ubuntu/safelensai-backend/safelensai-backend-api-server
 
permissions:
  - object: /home/ubuntu/safelensai-backend/safelensai-backend-api-server
    owner: ubuntu
    group: ubuntu
 
hooks:
  AfterInstall:
    - location: scripts/ops/deploy.sh
      timeout: 300
      runas: ubuntu