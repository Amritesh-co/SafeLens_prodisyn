# Supervisor configuration for SafeLensAI API
# /etc/supervisor/conf.d/safelens.conf

[program:safelens]
command=/home/ubuntu/app/database-api/venv/bin/gunicorn -c /home/ubuntu/app/database-api/gunicorn_config.py safelensai.wsgi
directory=/home/ubuntu/app/database-api
user=ubuntu
autostart=true
autorestart=true
stderr_logfile=/var/log/safelens/safelens.err.log
stdout_logfile=/var/log/safelens/safelens.out.log
environment=DJANGO_SETTINGS_MODULE="safelensai.settings",ENABLE_DB_INIT_ON_STARTUP="0"
